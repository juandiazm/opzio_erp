name: Deploy Laravel App to GCP

on:
  push:
    branches:
      - main  # Replace 'main' with the branch to deploy.

concurrency:
  group: opzio-erp-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Cache node modules
      uses: actions/cache@v3
      id: npm-cache
      with:
        path: |
          ~/.npm
          node_modules
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}-fontawesome-pro
        restore-keys: |
          ${{ runner.os }}-node-

    - name: Configure FontAwesome Pro credentials 
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        # Configure FontAwesome Pro registry and credentials
        npm config set @fortawesome:registry https://npm.fontawesome.com/
        npm config set //npm.fontawesome.com/:_authToken ${NPM_TOKEN}
        
        # Create .npmrc in home directory with FontAwesome credentials
        echo "@fortawesome:registry=https://npm.fontawesome.com/" >> ~/.npmrc
        echo "//npm.fontawesome.com/:_authToken=${NPM_TOKEN}" >> ~/.npmrc
        
        # Also configure in project directory
        echo "@fortawesome:registry=https://npm.fontawesome.com/" > .npmrc
        echo "//npm.fontawesome.com/:_authToken=${NPM_TOKEN}" >> .npmrc

    - name: Install dependencies (with cache optimization)
      run: |
        if [ "${{ steps.npm-cache.outputs.cache-hit }}" != "true" ]; then
          echo "Cache miss - installing dependencies"
          npm ci --prefer-offline --no-audit
        else
          echo "Cache hit - verifying node_modules integrity"
          # Verify node_modules integrity
          if [ ! -d "node_modules" ] || [ ! -f "node_modules/.package-lock.json" ]; then
            echo "Node modules corrupted - reinstalling"
            npm ci --prefer-offline --no-audit
          else
            echo "Node modules cache is valid, skipping npm install"
          fi
        fi

    - name: Build project
      run: |
        npm run build
    
    - name: Package build for deployment
      run: |
        tar -czf build.tar.gz app bootstrap/app.php config database public/build public/images public/.htaccess resources composer.json composer.lock artisan routes \
          public/manifest.json public/service-worker.js public/favicon.ico public/apple-touch-icon.png public/offline.html

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add server to known_hosts
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh
        ssh-keyscan -T 10 -H 35.239.181.103 >> ~/.ssh/known_hosts || true

    - name: Ensure deployment directory exists
      run: |
        ssh -o StrictHostKeyChecking=no git@35.239.181.103 'sudo mkdir -p /var/www/html/opzio_erp && sudo chmod -R 777 /var/www/html/opzio_erp'
    
    - name: Deploy storage directory
      run: |
        if ssh -o StrictHostKeyChecking=no git@35.239.181.103 '[ ! -d "/var/www/html/opzio_erp/storage" ]'; then
          echo "Storage directory not found. Copying from repository..."
          scp -r ./storage git@35.239.181.103:/var/www/html/opzio_erp/
          ssh -o StrictHostKeyChecking=no git@35.239.181.103 'sudo chmod -R 777 /var/www/html/opzio_erp/storage'
        else
          echo "Storage directory exists. Nothing to do."
        fi

    - name: Deploy public directory
      run: |
        if ssh -o StrictHostKeyChecking=no git@35.239.181.103 '[ ! -d "/var/www/html/opzio_erp/public" ]'; then
          echo "Public directory not found. Copying from repository..."
          scp -r ./public git@35.239.181.103:/var/www/html/opzio_erp/
        else
          ssh -o StrictHostKeyChecking=no git@35.239.181.103 'sudo rm -rf /var/www/html/opzio_erp/public/build /var/www/html/opzio_erp/public/images /var/www/html/opzio_erp/public/fonts'
          if [ -d "./public/build" ]; then
            scp -r ./public/build git@35.239.181.103:/var/www/html/opzio_erp/public
          fi
          if [ -d "./public/images" ]; then
            scp -r ./public/images git@35.239.181.103:/var/www/html/opzio_erp/public
          fi
          if [ -d "./public/fonts" ]; then
            scp -r ./public/fonts git@35.239.181.103:/var/www/html/opzio_erp/public
          fi
          scp ./public/.htaccess git@35.239.181.103:/var/www/html/opzio_erp/public/.htaccess
        fi
        ssh -o StrictHostKeyChecking=no git@35.239.181.103 'sudo chmod -R 777 /var/www/html/opzio_erp/public'
        

    - name: Deploy .env file
      run: |
        if ssh -o StrictHostKeyChecking=no git@35.239.181.103 '[ ! -f "/var/www/html/opzio_erp/.env" ]'; then
          echo ".env file not found. Copying from repository..."
          scp .env_temp git@35.239.181.103:/var/www/html/opzio_erp/.env
        fi

    - name: Deploy to server
      run: |
        scp build.tar.gz git@35.239.181.103:/var/www/html/opzio_erp
        ssh git@35.239.181.103 << 'EOF'
        set -e
        cleanup() {
          rm -f build.tar.gz composer.phar
        }
        trap cleanup EXIT
        cd /var/www/html/opzio_erp
        set_env_default() {
          key="$1"
          value="$2"
          if ! grep -q "^${key}=" .env; then
            printf '%s\n' "${key}=${value}" >> .env
          fi
        }
        set_env_default BROWSERSHOT_NODE_MODULES /opt/opzio/browsershot/node_modules
        set_env_default BROWSERSHOT_PUPPETEER_CACHE /opt/opzio/browsershot/cache
        set_env_default BROWSERSHOT_NO_SANDBOX true
        set_env_default PDF_NODE_BINARY /usr/bin/node
        sudo tar --no-same-owner --no-same-permissions --no-overwrite-dir -xzf build.tar.gz
        sudo rm -f bootstrap/cache/*.php
        curl -sS https://getcomposer.org/installer | php8.2
        sudo -u www-data -H env HOME=/var/www php8.2 composer.phar install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
        sudo -u www-data -H env HOME=/var/www php8.2 artisan optimize:clear
        sudo -u www-data -H env HOME=/var/www php8.2 artisan migrate --force
        sudo -u www-data -H env HOME=/var/www php8.2 artisan storage:link --force
        sudo -u www-data -H env HOME=/var/www php8.2 artisan config:clear
        sudo -u www-data -H env HOME=/var/www php8.2 artisan route:cache
        sudo -u www-data -H env HOME=/var/www php8.2 artisan view:cache
        fpm_user="$(ps -eo user=,comm=,args= | awk '$2 ~ /^php-fpm/ && $0 ~ /pool/ {print $1; exit}')"
        if [ -z "${fpm_user}" ]; then
          echo "Unable to determine the PHP-FPM pool user; refusing to skip the PDF smoke test." >&2
          exit 1
        fi
        if [ "${fpm_user}" != "www-data" ]; then
          echo "Detected PHP-FPM user '${fpm_user}', but this deployment currently assigns the project to www-data." >&2
          exit 1
        fi
        sudo -u "${fpm_user}" -H php8.2 artisan queue:restart
        sudo -u "${fpm_user}" -H php8.2 artisan browsershot:smoke-test
        rm -f build.tar.gz composer.phar
        EOF

    - name: Setting ownership
      run: |
        ssh -o StrictHostKeyChecking=no git@35.239.181.103 'sudo chown -R www-data:www-data /var/www/html/opzio_erp'

    
